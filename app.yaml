
kind: wasmer.io/App.v0
name: tp-entornos-graficos
owner: adrianpautasso
package: .
jobs:
  - name: ejecutar-migraciones
    trigger: post-deployment
    action:
      execute:
        package: wasmer/bash
        command: bash
        cli_args:
          - -lc
          - php artisan migrate --force
        timeout: 5m
